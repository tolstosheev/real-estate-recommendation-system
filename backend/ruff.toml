target-version = "py312"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "N802",  # function name should be lowercase (for async SQLAlchemy)
    "N803",  # argument name should be lowercase (for Pydantic)
    "N806",  # variable in function should be lowercase
    "SIM108", # use ternary operator (keeps readability)
    "B008",  # function-call-in-default-argument (FastAPI Depends/Query/File pattern)
]
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"alembic/**" = ["ALL"]
"tests/**" = ["ALL"]
"**/__init__.py" = ["F401"]

[format]
quote-style = "single"
