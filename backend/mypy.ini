[mypy]
python_version = 3.12
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true

exclude = (?x)(
    alembic/
  | tests/
)

[mypy-alembic.*]
ignore_errors = true

[mypy-sqlalchemy.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true

[mypy-fastapi.*]
ignore_missing_imports = true

[mypy-starlette.*]
ignore_missing_imports = true

[mypy-passlib.*]
ignore_missing_imports = true

[mypy-bcrypt.*]
ignore_missing_imports = true

[mypy-httpx.*]
ignore_missing_imports = true

[mypy-pandas.*]
ignore_missing_imports = true

[mypy-sklearn.*]
ignore_missing_imports = true

[mypy-alembic.*]
ignore_missing_imports = true

[mypy-asyncpg.*]
ignore_missing_imports = true

[mypy-psycopg2.*]
ignore_missing_imports = true

[mypy-redis.*]
ignore_missing_imports = true

[mypy-minio.*]
ignore_missing_imports = true

[mypy-pydantic_settings.*]
ignore_missing_imports = true

[mypy-geoalchemy2.*]
ignore_missing_imports = true
