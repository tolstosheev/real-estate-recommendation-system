name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nestai_test
        options: >-
          --health-cmd "pg_isready -U user -d nestai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short -o "addopts=--cov=app --cov-report=term-missing --cov-report=html:coverage_html --cov-fail-under=70 -v"
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/nestai_test
          TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/nestai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --run
        env:
          VITE_YANDEX_GEOCODER_API_KEY: test-key

  backend-integration:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nestai_test
        options: >-
          --health-cmd "pg_isready -U user -d nestai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U user && break
            sleep 1
          done

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data

      - name: Create test bucket
        run: |
          pip install minio
          for i in $(seq 1 30); do
            if python -c "from minio import Minio; c = Minio('localhost:9000', access_key='minioadmin', secret_key='minioadmin', secure=False); c.make_bucket('nestai-images-test'); print('Bucket created')" 2>&1; then
              echo "Bucket ready"
              break
            fi
            echo "Waiting for MinIO... attempt $i"
            sleep 2
          done

      - name: Run migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/nestai_test
          SECRET_KEY: ci-secret-key-not-for-production

      - name: Run integration tests
        run: python -m pytest tests/ -v --tb=short --ignore=tests/e2e
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/nestai_test
          TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/nestai_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: nestai-images-test
          SECRET_KEY: ci-secret-key-not-for-production
